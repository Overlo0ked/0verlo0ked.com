<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📝 Notes App</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-purple-100 to-blue-100 min-h-screen font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <header class="text-center mb-6">
      <h1 class="text-4xl font-bold text-purple-700 drop-shadow">📝 Notes App</h1>
      <p class="text-gray-600">Capture your thoughts quickly & easily</p>
    </header>

    <section class="bg-white shadow-lg rounded-xl p-5 mb-6">
      <input id="note-title" type="text" placeholder="Title" class="w-full p-3 mb-3 border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
      <textarea id="note-body" rows="4" placeholder="Your note..." class="w-full p-3 border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"></textarea>
      <button onclick="addNote()" class="mt-4 px-5 py-2 bg-purple-600 text-white font-semibold rounded hover:bg-purple-700 transition">➕ Add Note</button>
    </section>

    <section id="notes" class="space-y-4 max-h-[60vh] overflow-y-auto"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
